[package]
name = "pdf-view"
version = "0.1.0"
description = "Lightweight desktop PDF viewer"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
# AI 请求的直连回退通道：与控制台插件相同的 TLS / HTTP2 特性，
# 但可以显式关闭系统代理，并返回完整的错误链。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "stream"] }
futures-util = "0.3"
base64 = "0.22"
